<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="bg-light">

<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-lg border-0" style="width:460px">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus display-4 text-primary"></i>
                <h2 class="fw-bold mt-2">Create Account</h2>
                <p class="text-muted">Join SplitEase today</p>
            </div>

            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Full Name</label>
                    <input type="text" id="regName" class="form-control"
                           placeholder="John Doe" required minlength="2"/>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" id="regEmail" class="form-control"
                           placeholder="you@example.com" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Phone (optional)</label>
                    <input type="tel" id="regPhone" class="form-control"
                           placeholder="+1 555 000 0000"/>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" id="regPassword" class="form-control"
                           placeholder="At least 8 characters" required minlength="8"/>
                </div>
                <div id="regError" class="alert alert-danger small py-2 d-none"></div>
                <button type="submit" class="btn btn-primary w-100 fw-semibold">
                    <i class="bi bi-person-check"></i> Create Account
                </button>
            </form>

            <hr/>
            <div class="text-center small">
                Already have an account? <a href="/login">Sign in</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('regError');
    errEl.classList.add('d-none');

    const payload = {
        name:     document.getElementById('regName').value,
        email:    document.getElementById('regEmail').value,
        phone:    document.getElementById('regPhone').value || null,
        password: document.getElementById('regPassword').value
    };

    try {
        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            errEl.textContent = err.message || 'Registration failed';
            errEl.classList.remove('d-none');
            return;
        }
        const data = await res.json();
        localStorage.setItem('jwt', data.accessToken);
        localStorage.setItem('refreshToken', data.refreshToken);
        localStorage.setItem('userId', data.userId);
        localStorage.setItem('userName', data.name);
        document.cookie = `jwt=${data.accessToken}; path=/; SameSite=Strict`;
        window.location.href = '/dashboard';
    } catch (err) {
        errEl.textContent = 'Network error. Please try again.';
        errEl.classList.remove('d-none');
    }
});
</script>
</body>
</html>
