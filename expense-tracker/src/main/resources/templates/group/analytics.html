<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Analytics')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-4">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
            <li class="breadcrumb-item"><a th:href="@{/groups/{id}(id=${group.id})}" th:text="${group.name}">Group</a></li>
            <li class="breadcrumb-item active">Analytics</li>
        </ol>
    </nav>

    <h4 class="fw-bold mb-4">
        <i class="bi bi-bar-chart text-primary"></i>
        Analytics — <span th:text="${group.name}">Group</span>
    </h4>

    <!-- Summary Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm text-center">
                <div class="card-body">
                    <div class="text-muted small">Today</div>
                    <div class="fs-3 fw-bold text-primary"
                         th:text="${group.defaultCurrency} + ' ' + ${#numbers.formatDecimal(summary.todayTotal,1,2)}">$0</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm text-center">
                <div class="card-body">
                    <div class="text-muted small">This Week</div>
                    <div class="fs-3 fw-bold text-success"
                         th:text="${group.defaultCurrency} + ' ' + ${#numbers.formatDecimal(summary.thisWeekTotal,1,2)}">$0</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm text-center">
                <div class="card-body">
                    <div class="text-muted small">This Month</div>
                    <div class="fs-3 fw-bold text-info"
                         th:text="${group.defaultCurrency} + ' ' + ${#numbers.formatDecimal(summary.thisMonthTotal,1,2)}">$0</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Monthly Bar Chart -->
        <div class="col-md-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-semibold border-0">
                    <i class="bi bi-bar-chart-fill text-primary"></i> Monthly Spending
                </div>
                <div class="card-body">
                    <canvas id="monthlyChart" height="120"></canvas>
                </div>
            </div>
        </div>

        <!-- Category Pie Chart -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-semibold border-0">
                    <i class="bi bi-pie-chart-fill text-primary"></i> By Category
                </div>
                <div class="card-body">
                    <canvas id="categoryChart" height="180"></canvas>
                </div>
            </div>
        </div>

        <!-- Weekly Line Chart -->
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-semibold border-0">
                    <i class="bi bi-graph-up text-primary"></i> Weekly Trend
                </div>
                <div class="card-body">
                    <canvas id="weeklyChart" height="80"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script th:inline="javascript">
// Thymeleaf injects server-side data as JS arrays
const monthlyData  = /*[[${monthlyData}]]*/ [];
const weeklyData   = /*[[${weeklyData}]]*/ [];
const categoryData = /*[[${categoryData}]]*/ [];

const COLORS = [
    '#4361ee','#3a0ca3','#7209b7','#f72585','#4cc9f0',
    '#4895ef','#560bad','#f3722c','#f8961e','#90be6d','#43aa8b','#577590'
];

// ── Monthly Bar ──────────────────────────────────────────────────────────────
new Chart(document.getElementById('monthlyChart'), {
    type: 'bar',
    data: {
        labels: monthlyData.map(d => d.label),
        datasets: [{
            label: 'Spending',
            data: monthlyData.map(d => d.value),
            backgroundColor: '#4361ee',
            borderRadius: 6
        }]
    },
    options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true } }
    }
});

// ── Category Doughnut ────────────────────────────────────────────────────────
new Chart(document.getElementById('categoryChart'), {
    type: 'doughnut',
    data: {
        labels: categoryData.map(d => d.label),
        datasets: [{
            data: categoryData.map(d => d.value),
            backgroundColor: COLORS,
            hoverOffset: 10
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: { position: 'bottom', labels: { font: { size: 11 } } }
        }
    }
});

// ── Weekly Line ──────────────────────────────────────────────────────────────
new Chart(document.getElementById('weeklyChart'), {
    type: 'line',
    data: {
        labels: weeklyData.map(d => d.label),
        datasets: [{
            label: 'Weekly Spend',
            data: weeklyData.map(d => d.value),
            borderColor: '#4cc9f0',
            backgroundColor: 'rgba(76,201,240,0.15)',
            tension: 0.4,
            fill: true,
            pointBackgroundColor: '#4cc9f0'
        }]
    },
    options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true } }
    }
});
</script>
</body>
</html>
