<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-0">My Groups</h4>
            <p class="text-muted small mb-0">Manage shared expenses across all your groups</p>
        </div>
        <div class="d-flex gap-2">
            <a href="/personal-expenses" class="btn btn-outline-secondary">
                <i class="bi bi-person-check"></i> My Expenses
            </a>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createGroupModal">
                <i class="bi bi-plus-circle"></i> New Group
            </button>
        </div>
    </div>

    <!-- Groups Grid -->
    <div class="row g-3" id="groupsGrid">
        <div th:each="group : ${groups}" class="col-md-4">
            <div class="card h-100 border-0 shadow-sm hover-card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h5 class="card-title fw-semibold mb-1" th:text="${group.name}">Group Name</h5>
                            <p class="text-muted small mb-0" th:text="${group.description ?: 'No description'}">desc</p>
                        </div>
                        <span class="badge bg-primary-subtle text-primary"
                              th:text="${group.defaultCurrency}">USD</span>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <a th:href="@{/groups/{id}(id=${group.id})}"
                           class="btn btn-sm btn-outline-primary flex-fill">
                            <i class="bi bi-eye"></i> View
                        </a>
                        <a th:href="@{/groups/{id}/analytics(id=${group.id})}"
                           class="btn btn-sm btn-outline-secondary flex-fill">
                            <i class="bi bi-bar-chart"></i> Analytics
                        </a>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-0 small text-muted">
                    <i class="bi bi-calendar3"></i>
                    Created <span th:text="${#temporals.format(group.createdAt,'MMM d, yyyy')}">date</span>
                </div>
            </div>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(groups)}" class="col-12 text-center py-5">
            <i class="bi bi-people display-1 text-muted"></i>
            <p class="text-muted mt-3">No groups yet. Create your first group to start splitting!</p>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createGroupModal">
                <i class="bi bi-plus-circle"></i> Create Group
            </button>
        </div>
    </div>
</div>

<!-- Create Group Modal -->
<div class="modal fade" id="createGroupModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-semibold">Create New Group</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Group Name *</label>
                    <input type="text" id="grpName" class="form-control" placeholder="Weekend Trip"/>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea id="grpDesc" class="form-control" rows="2"
                              placeholder="What's this group for?"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Currency</label>
                    <select id="grpCurrency" class="form-select">
                        <option value="USD">USD - US Dollar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="INR">INR - Indian Rupee</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Invite Members (emails, comma-separated)</label>
                    <input type="text" id="grpMembers" class="form-control"
                           placeholder="alice@example.com, bob@example.com"/>
                </div>
                <div id="grpError" class="alert alert-danger small py-2 d-none"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="createGroup()">
                    <i class="bi bi-plus-circle"></i> Create
                </button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script>
async function createGroup() {
    const name        = document.getElementById('grpName').value.trim();
    const description = document.getElementById('grpDesc').value.trim();
    const currency    = document.getElementById('grpCurrency').value;
    const rawEmails   = document.getElementById('grpMembers').value;
    const errEl       = document.getElementById('grpError');
    const btn         = document.querySelector('#createGroupModal .modal-footer .btn-primary');
    errEl.classList.add('d-none');

    if (!name) { errEl.textContent = 'Group name is required'; errEl.classList.remove('d-none'); return; }

    const memberEmails = rawEmails.split(',').map(e => e.trim()).filter(Boolean);

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Creating...';

    try {
        const res = await apiPost('/api/groups', {name, description, defaultCurrency: currency, memberEmails});
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            errEl.textContent = err.detail || err.message || 'Failed to create group';
            errEl.classList.remove('d-none');
            return;
        }
        window.location.reload();
    } catch (e) {
        errEl.textContent = 'Network error';
        errEl.classList.remove('d-none');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-plus-circle"></i> Create';
    }
}
</script>
</body>
</html>
